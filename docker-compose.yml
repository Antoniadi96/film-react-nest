services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: film-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prac}
      POSTGRES_USER: ${POSTGRES_USER:-prac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prac}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/SQL:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prac}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - film-network

  # PgAdmin (опционально - для управления БД)
  pgadmin:
    image: dpage/pgadmin4
    container_name: film-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@film.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - film-network

  # Backend (Nest.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: film-backend
    restart: always
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      LOGGER_TYPE: ${BACKEND_LOGGER_TYPE:-json}
      DATABASE_DRIVER: ${BACKEND_DATABASE_DRIVER:-postgres}
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql://prac:prac@postgres:5432/prac}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: prac
      POSTGRES_PASSWORD: prac
      POSTGRES_DB: prac
    ports:
    - "3001:${BACKEND_PORT:-3000}"
    volumes:
    - ./backend/public:/app/public 
    depends_on:
    - postgres
    networks:
    - film-network



  # Nginx (Reverse Proxy)
  nginx:
    build:
      context: .  # Важно: контекст теперь корень проекта, а не папка nginx
      dockerfile: ./nginx/Dockerfile
    container_name: film-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/public:/usr/share/nginx/html/public  # Монтируем картинки в nginx тоже
    depends_on:
      - backend
    networks:
      - film-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  film-network:
    driver: bridge