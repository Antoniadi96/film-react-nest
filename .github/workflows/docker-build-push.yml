name: Build and Push Docker Images

on:
  push:
    branches: [ main, master, review-* ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  USERNAME: antoniadi96

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.USERNAME }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 1. Сборка и публикация Frontend образа
    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.USERNAME }}/film-frontend:latest
          ${{ env.REGISTRY }}/${{ env.USERNAME }}/film-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 2. Сборка и публикация Backend образа
    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.USERNAME }}/film-backend:latest
          ${{ env.REGISTRY }}/${{ env.USERNAME }}/film-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 3. Сборка и публикация Nginx образа
    - name: Build and push Nginx image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./nginx/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.USERNAME }}/film-nginx:latest
          ${{ env.REGISTRY }}/${{ env.USERNAME }}/film-nginx:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
